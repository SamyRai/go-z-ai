# GoReleaser config for go-z-ai.
# Triggered by .github/workflows/release.yml on tag pushes matching v*.
# Docs: https://goreleaser.com
version: 2

project_name: go-z-ai

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: go-z-ai
    main: .
    binary: go-z-ai
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
      # Also inject into the library-level version var so pkg/client.Version()
      # and the default User-Agent ("go-z-ai/<version>") are correct for
      # library users, not just CLI users. main.go's copy stays for the CLI's
      # --version flag (legacy); both receive identical values at release time.
      - -X github.com/SamyRai/go-z-ai/pkg/client.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

sboms:
  - id: go-z-ai
    artifacts: archive

signs:
  - id: cosign-keyless
    cmd: cosign
    # cosign 3.x keyless sign-blob embeds signature + certificate in a single
    # --bundle file; the separate .pem/.sig outputs used by cosign 2.x are no
    # longer produced. signature: names the bundle as the uploaded artifact.
    signature: '${artifact}.bundle'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '--yes'
      - '${artifact}'
    artifacts: all

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  draft: false
  prerelease: auto
  # NOTE: discussion_category_name was removed. GoReleaser posts a linked
  # Discussion on release, but GitHub intermittently returns 404 on the
  # category lookup even when the category exists, which fails the release
  # job *after* the release + assets are already published — leaving a red
  # workflow for a successful release. Post release announcements manually
  # in Discussions → Announcements instead.
  name_template: '{{.Tag}}'
