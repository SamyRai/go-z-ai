name: CodeQL

# Static analysis (SAST) on push/PR to main + a weekly sweep. Uploads SARIF
# to the Security tab so alerts surface inline on pull requests.
# Free for public repos. Engine: https://github.com/github/codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '33 4 * * 1'   # weekly, Monday ~04:33 UTC (offset to avoid the pile-up)

# Least-privilege top-level default; the analyze job escalates only what it
# needs (Scorecard Token-Permissions expects write scopes to be job-scoped,
# never granted broadly at the top level).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
      packages: read           # fetch internal/private CodeQL packs if any
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        # github/codeql-action/init@v4.37.1
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          languages: go
          build-mode: autobuild
          # Default suite + extended (extra security) + quality (maintainability/reliability).
          # Docs: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze@v4.37.1
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          category: "/language:go"
