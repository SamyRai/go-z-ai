name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'   # nightly fuzz ~05:17 UTC (offset to avoid the pile-up)
  workflow_dispatch: {}    # manual trigger for the fuzz job

permissions:
  contents: read

# Cancel superseded PR runs; let main-branch runs queue normally.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build, vet, and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.1
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$diff"
            exit 1
          fi

      - name: Test (race + coverage)
        run: go test -race -coverprofile=cover.out -covermode=atomic ./...

      - name: Print coverage summary
        run: go tool cover -func=cover.out | tail -1

      - name: Enforce coverage floor
        # Ratchet-only floor: prevents coverage from regressing without
        # forcing a specific target. Bump MIN when the actual rises and stays.
        # Current actual is ~51%; floor sits at 49% (2-pt buffer against
        # per-OS matrix flake). New packages (e.g. pkg/observe) must not
        # depress this.
        run: |
          set -euo pipefail
          MIN=49
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${total}% (floor: ${MIN}%)"
          awk -v t="$total" -v m="$MIN" 'BEGIN { if (t+0 < m+0) exit 1 }'

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cover.out
          path: cover.out
          if-no-files-found: error
          retention-days: 14

  lint:
    name: golangci-lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.1
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        # golangci/golangci-lint-action@v9.3.0
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.1
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  docs:
    name: Lint docs (markdown + links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: markdownlint
        # DavidAnson/markdownlint-cli2-action@v24.1.0
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: |
            README*.md
            docs/**/*.md
            CONTRIBUTING.md
            examples/README.md
            .github/**/*.md

      - name: Restore lychee cache
        # actions/cache@v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lycheecache
          key: lychee-cache-${{ hashFiles('README*.md', 'docs/**/*.md', 'CONTRIBUTING.md', 'examples/README.md', '.github/**/*.md') }}
          restore-keys: lychee-cache-

      - name: Link check
        # lycheeverse/lychee-action@v2.9.0
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 30d
            --max-concurrency 10
            --exclude 'pkg\.go\.dev'
            --exclude 'docs\.z\.ai'
            --exclude 'localhost'
            README*.md docs/**/*.md CONTRIBUTING.md examples/README.md .github/**/*.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    name: Fuzz (nightly)
    # Coverage-guided fuzzing of the untrusted-input parsers (tool-schema
    # rewriter + SSE reader). Runs nightly so it doesn't gate PRs; a crash
    # found here is filed as a failing run for triage, not a merge block.
    # Discoveries land in testdata/fuzz/ as committed regression cases.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.1
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz the tool-schema rewriter (2 min)
        run: go test -run=^$ -fuzz=FuzzSanitizeToolSchemas -fuzztime=120s ./pkg/client/

      - name: Fuzz the SSE stream parser (2 min)
        run: go test -run=^$ -fuzz=FuzzReadSSE -fuzztime=120s ./pkg/client/
